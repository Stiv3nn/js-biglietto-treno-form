<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JS-biglietto-treno-form</title>
</head>
<body>
    
    <h1>Calcola il prezzo del tuo biglietto del treno</h1>

    <!-- ELEMENTI DI INPUT DELLA PAGINA -->
    <form id="elementi-ingresso">

        <input id="nome-congome" type="text" placeholder="Inserisci nome e cognome" required>
        <input id="KM" type="text" placeholder="KM da percorrere" required>
        <input id="età" type="text" placeholder="Inserisci la tua età" required><br><br>
        <button id="bottone">Invia</button>

    </form>
    <br>


    <!-- ELEMENTI OUTPUT -->
    <h1>Il tuo biglietto</h1>
    <h3>Dettaglio passaggeri</h3>

   <div>Nome passaggero</div>
   <div id="name"></div>



    <script src="script.js"></script>


</body>
</html>
